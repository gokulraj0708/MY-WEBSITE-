<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>

    <link rel="stylesheet" href="style.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>
    <div class="bg-animation">
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
</div>
<div id="welcomeScreen">
    <div class="welcome-box">
        <h1>👋 Welcome!</h1>
        <h2>Hi, created by HARISH and GOKUL</h2>
        <p>B.Sc. Computer Science with Artificial Intelligence</p>
        <p>Welcome to my Student Management System</p>
    </div>
</div>

<div class="loader">
    <div class="spinner"></div>
</div>
<header>
    <h1>STUDENT MANAGEMENT SYSTEM</h1>

    <div>
        <button id="themeBtn">
            <i class="fa-solid fa-moon"></i>
        </button>

        <div class="profile-wrapper">
    <button id="profileBtn">
        <i class="fa-solid fa-user"></i>
    </button>

    <div class="team" id="teamMenu">
        <p>created by</p>
        <div class="member" onclick="showProfile('hari')">
            <img src="Snapchat-1003517570.jpg" class="profile-img">
            <h3>HARISH</h3>
        </div>

        <div class="member" onclick="showProfile('friend')">
            <img src="IMG-20260802-WA0002.jpg" class="profile-img">
            <h3>GOOGLE</h3>
        </div>
    </div>
</div>
    
</header>

<div class="container">

<div class="top">

<input type="text" id="search" placeholder="Search Student...">

<button id="addBtn">
<i class="fa-solid fa-plus"></i>
Add Student
</button>

</div>

<div class="cards">

<div class="card">
<h2 id="totalStudents">0</h2>
<p>Total Students</p>
</div>

<div class="card">
<h2 id="maleCount">0</h2>
<p>Male</p>
</div>

<div class="card">
<h2 id="femaleCount">0</h2>
<p>Female</p>
</div>

</div>

<table>

<thead>

<tr>

<th>Name</th>

<th>Age</th>

<th>Department</th>

<th>Gender</th>

<th>Actions</th>

</tr>

</thead>

<tbody id="studentTable">

</tbody>

</table>

</div>

<!-- Popup -->

<div class="popup" id="popup">

<div class="popup-content">

<h2>Add Student</h2>

<input type="text" id="name" placeholder="Student Name">

<input type="number" id="age" placeholder="Age">

<input type="text" id="dept" placeholder="Department">

<select id="gender">

<option>Male</option>

<option>Female</option>

</select>

<div class="buttons">

<button id="saveBtn">Save</button>

<button id="closeBtn">Cancel</button>

</div>

</div>

</div>

<div id="profilePopup" class="profile-popup">
    <div class="profile-box">
        <span id="closeProfile">&times;</span>
        <div id="profileInfo"></div>
    </div>
</div>


<script src="script.js"></script>

</body>
</html>
